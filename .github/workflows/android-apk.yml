
      - name: Extract project
        run: |
          set -e

          test -f horror.zip
          mkdir -p project
          unzip -oq horror.zip -d project

          echo "===== PROJECT FILES ====="
          find project -type f | head -200

          echo "===== GRADLE FILES ====="
          find project -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts"

          echo "===== ASSETS ====="
          find project -path "*/src/main/assets/*" -type f | head -100
