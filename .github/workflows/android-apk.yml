
name: Build ASOMA HOUSE HAMMER APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          test -f "house-hammer-android xr.zip"
          mkdir project
          unzip -oq "house-hammer-android xr.zip" -d project
          test -f project/app/src/main/assets/index.html
          test -f project/app/src/main/assets/lan.js

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Download Three.js
        run: |
          curl -fsSL \
            -o project/app/src/main/assets/three.min.js \
            https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js

      - name: Build APK
        run: |
          gradle -p project :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ASOMA-HOUSE-HAMMER-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
