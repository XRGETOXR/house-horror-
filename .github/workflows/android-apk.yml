
name: Build Hammer Man Multiplayer APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build Hammer Man APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Find Correct Game ZIP
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          root = Path(".")
          project = None

          if Path("package.json").is_file() and Path("capacitor.config.json").is_file():
              project = Path(".")
          else:
              build_dir = Path(".build/game")
              build_dir.mkdir(parents=True, exist_ok=True)

              for archive in root.rglob("*.zip"):
                  if ".git" in archive.parts or ".build" in archive.parts:
                      continue

                  try:
                      with zipfile.ZipFile(archive) as z:
                          names = [
                              n.replace("\\", "/").lstrip("./")
                              for n in z.namelist()
                          ]

                          packages = {
                              str(Path(n).parent)
                              for n in names
                              if Path(n).name == "package.json"
                          }

                          configs = {
                              str(Path(n).parent)
                              for n in names
                              if Path(n).name == "capacitor.config.json"
                          }

                          matches = packages & configs

                          if matches:
                              folder = sorted(matches, key=len)[0]
                              print(f"Correct game archive: {archive}")
                              print(f"Project folder inside ZIP: {folder}")

                              z.extractall(build_dir)

                              project = build_dir / folder
                              if folder == ".":
                                  project = build_dir
                              break

                  except zipfile.BadZipFile:
                      continue

          if project is None:
              raise SystemExit(
                  "ERROR: No ZIP containing both package.json "
                  "and capacitor.config.json was found."
              )

          if not (project / "package.json").is_file():
              raise SystemExit("ERROR: package.json missing")

          if not (project / "capacitor.config.json").is_file():
              raise SystemExit("ERROR: capacitor.config.json missing")

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"PROJECT_DIR={project.as_posix()}\n")

          print(f"Selected project: {project}")
          PY

      - name: Install Android SDK
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)

          test -n "$SDKMANAGER"

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Fix Dependency Conflict
        run: |
          cd "$PROJECT_DIR"

          npm pkg set 'devDependencies.esbuild=^0.28.2'

      - name: Install Dependencies
        run: |
          cd "$PROJECT_DIR"

          npm install --no-audit --no-fund

          npm install \
            @capacitor/core@6 \
            @capacitor/android@6 \
            --no-audit --no-fund

          npm install -D @capacitor/cli@6 \
            --no-audit --no-fund

      - name: Build Game
        run: |
          cd "$PROJECT_DIR"

          npm run build

          test -s dist/index.html

      - name: Prepare Android
        run: |
          cd "$PROJECT_DIR"

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Configure Android
        run: |
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_WIFI_STATE",
              "android.permission.CHANGE_WIFI_MULTICAST_STATE",
              "android.permission.ACCESS_NETWORK_STATE"
          ]

          for perm in permissions:
              if perm not in s:
                  s = s.replace(
                      "<application",
                      f'<uses-permission android:name="{perm}" />\n    <application',
                      1
                  )

          if "android:usesCleartextTraffic" not in s:
              s = s.replace(
                  "<application",
                  '<application android:usesCleartextTraffic="true"',
                  1
              )

          if "android:screenOrientation" not in s:
              s = s.replace(
                  "<activity",
                  '<activity android:screenOrientation="sensorLandscape"',
                  1
              )

          p.write_text(s)
          PY

      - name: Build APK
        run: |
          cd "$PROJECT_DIR/android"

          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          APK="$PROJECT_DIR/android/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HAMMER-MAN-MULTIPLAYER-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
