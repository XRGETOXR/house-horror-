
name: Build HORROR HOUSE APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip -o "HORROR HOUSE GitHub.zip"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle --no-daemon -p hammer_house_android assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: HORROR-HOUSE-APK
          path: hammer_house_android/app/build/outputs/apk/debug/app-debug.apk
