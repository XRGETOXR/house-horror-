
name: Build بيت المطرقة APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract GETO game
        run: |
          set -e
          test -f "GETO.zip"
          mkdir -p project
          unzip -oq "GETO.zip" -d project
          test -f project/package.json
          test -f project/vite.config.ts
          test -f project/index.html
          echo "Game files verified"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fix dependencies
        working-directory: project
        run: |
          npm pkg set 'devDependencies.esbuild=^0.28.2'
          npm install

      - name: Build game
        working-directory: project
        run: |
          npm run build
          test -f dist/index.html

      - name: Install Capacitor Android
        working-directory: project
        run: |
          npm install @capacitor/core@6 @capacitor/android@6
          npm install -D @capacitor/cli@6

      - name: Configure app
        working-directory: project
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.hammerhouse.game",
            "appName": "بيت المطرقة",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            },
            "android": {
              "backgroundColor": "#050404"
            }
          }
          EOF

      - name: Add Android platform
        working-directory: project
        run: npx cap add android

      - name: Sync Android
        working-directory: project
        run: npx cap sync android

      - name: Configure Android
        working-directory: project
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          xml = p.read_text()

          if "android:screenOrientation" not in xml:
              xml = xml.replace(
                  "<activity",
                  '<activity android:screenOrientation="sensorLandscape"',
                  1
              )

          if "android.permission.WAKE_LOCK" not in xml:
              xml = xml.replace(
                  "<application",
                  '<uses-permission android:name="android.permission.WAKE_LOCK" />\n    <application',
                  1
              )

          p.write_text(xml)
          PY

      - name: Build APK
        working-directory: project
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hammer-house-apk
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
