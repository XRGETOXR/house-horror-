
name: Build HORROR HOUSE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o "HORROR_HOUSE_ANDROID_PROJECT.zip" -d .
          echo "Project extracted successfully"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build HORROR HOUSE APK
        run: |
          gradle --no-daemon -p HORROR_HOUSE_ANDROID assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HORROR-HOUSE-APK
          path: HORROR_HOUSE_ANDROID/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
