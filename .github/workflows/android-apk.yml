
name: Build HORROR HOUSE APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build HORROR HOUSE Android
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Extract the exact game ZIP
      - name: Extract Multiplayer Horror
        run: |
          set -e

          ZIP="Multiplayer horror .zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found in repository"
            exit 1
          fi

          mkdir -p .build
          unzip -oq "$ZIP" -d .build

          if [ ! -f ".build/hhlan/package.json" ]; then
            echo "ERROR: Expected hhlan/package.json not found"
            find .build -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "Game extracted successfully"

      # All following Node commands run inside hhlan
      - name: Install dependencies
        working-directory: .build/hhlan
        run: |
          npm install --no-audit --no-fund

          npm install @capacitor/core@6 @capacitor/android@6 \
            --no-audit --no-fund

          npm install -D @capacitor/cli@6 \
            --no-audit --no-fund

      - name: Build game
        working-directory: .build/hhlan
        run: |
          npm run build
          test -s dist/index.html

      - name: Prepare Android
        working-directory: .build/hhlan
        run: |
          npx cap add android
          npx cap sync android

      # Install original LAN plugin
      - name: Install LAN Server
        working-directory: .build/hhlan
        run: |
          set -e

          SOURCE="android-plugin/src/main/java/com/hammerhouse/game/lan/LanServerPlugin.java"

          if [ ! -f "$SOURCE" ]; then
            echo "ERROR: LAN plugin missing"
            exit 1
          fi

          TARGET="android/app/src/main/java/com/hammerhouse/game/lan"

          mkdir -p "$TARGET"
          cp "$SOURCE" "$TARGET/LanServerPlugin.java"

          # WebSocket dependency
          GRADLE="android/app/build.gradle"

          if ! grep -q "Java-WebSocket" "$GRADLE"; then
            sed -i '/dependencies {/a\    implementation "org.java-websocket:Java-WebSocket:1.5.7"' "$GRADLE"
          fi

          # Register plugin and enable immersive full screen
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/java/com/hammerhouse/game/MainActivity.java")
          s = p.read_text()

          plugin_import = "import com.hammerhouse.game.lan.LanServerPlugin;"

          if plugin_import not in s:
              s = s.replace(
                  "import com.getcapacitor.BridgeActivity;",
                  "import com.getcapacitor.BridgeActivity;\n" + plugin_import
              )

          if "registerPlugin(LanServerPlugin.class)" not in s:
              marker = "public class MainActivity extends BridgeActivity {"

              if marker not in s:
                  raise SystemExit("MainActivity class declaration not found")

              s = s.replace(
                  marker,
                  marker + """
              @Override
              public void onCreate(android.os.Bundle savedInstanceState) {
                  registerPlugin(LanServerPlugin.class);
                  super.onCreate(savedInstanceState);
                  enableFullScreen();
              }

              private void enableFullScreen() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      android.view.View.SYSTEM_UI_FLAG_FULLSCREEN
                      | android.view.View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | android.view.View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | android.view.View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | android.view.View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | android.view.View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  );
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      enableFullScreen();
                  }
              }
              """
              )

          p.write_text(s)
          print("LAN plugin registered and Full Screen enabled")
          PY

      # Android landscape and network settings
      - name: Configure Android Manifest
        working-directory: .build/hhlan
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_WIFI_STATE",
              "android.permission.CHANGE_WIFI_MULTICAST_STATE",
              "android.permission.ACCESS_NETWORK_STATE"
          ]

          for perm in permissions:
              line = f'<uses-permission android:name="{perm}" />'
              if perm not in s:
                  s = s.replace("<application", line + "\n    <application", 1)

          if 'android:usesCleartextTraffic=' not in s:
              s = s.replace(
                  "<application",
                  '<application android:usesCleartextTraffic="true"',
                  1
              )

          if 'android:screenOrientation=' not in s:
              s = s.replace(
                  "<activity",
                  '<activity android:screenOrientation="sensorLandscape"',
                  1
              )

          p.write_text(s)
          print("Landscape and network permissions configured")
          PY

      # Build APK
      - name: Build APK
        working-directory: .build/hhlan/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -s .build/hhlan/android/app/build/outputs/apk/debug/app-debug.apk
          echo "APK build successful"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HORROR-HOUSE-APK
          path: .build/hhlan/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
