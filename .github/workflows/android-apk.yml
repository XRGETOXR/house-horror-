
name: Build Hammer Man Multiplayer APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Extract Hammer Man Multiplayer
        run: |
          set -e
          ZIP="Hammer Man Multiplayer .zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found"
            ls -la
            exit 1
          fi

          mkdir -p game
          unzip -oq "$ZIP" -d game

          PACKAGE=$(find game -type f -name package.json \
            -not -path "*/node_modules/*" | head -n 1)

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: package.json not found"
            exit 1
          fi

          PROJECT="${PACKAGE%/package.json}"

          if [ ! -f "$PROJECT/capacitor.config.json" ]; then
            echo "ERROR: capacitor.config.json not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Selected game: $PROJECT"

      - name: Install Android SDK
        run: |
          set -e
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDK" --licenses || true

          "$SDK" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Dependencies
        run: |
          cd "$PROJECT_DIR"

          npm install --legacy-peer-deps --no-audit --no-fund

          npm install @capacitor/core@6 \
            @capacitor/android@6 \
            --legacy-peer-deps --no-audit --no-fund

          npm install -D @capacitor/cli@6 \
            --legacy-peer-deps --no-audit --no-fund

      - name: Build Game
        run: |
          cd "$PROJECT_DIR"
          npm run build
          test -s dist/index.html

      - name: Prepare Android
        run: |
          cd "$PROJECT_DIR"

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Configure Android
        run: |
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_WIFI_STATE",
              "android.permission.CHANGE_WIFI_MULTICAST_STATE",
              "android.permission.ACCESS_NETWORK_STATE"
          ]

          for perm in permissions:
              if perm not in s:
                  s = s.replace(
                      "<application",
                      f'<uses-permission android:name="{perm}" />\n    <application',
                      1
                  )

          if "android:usesCleartextTraffic" not in s:
              s = s.replace(
                  "<application",
                  '<application android:usesCleartextTraffic="true"',
                  1
              )

          if "android:screenOrientation" not in s:
              s = s.replace(
                  "<activity",
                  '<activity android:screenOrientation="sensorLandscape"',
                  1
              )

          p.write_text(s)
          PY

      - name: Build APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          APK="$PROJECT_DIR/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HAMMER-MAN-MULTIPLAYER-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
