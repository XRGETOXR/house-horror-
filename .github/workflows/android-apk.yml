
name: Build HAMMER HOUSE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract game project
        run: |
          set -e
          test -f "Asoma game.zip"
          mkdir -p project
          unzip -oq "Asoma game.zip" -d project
          test -f project/package.json
          test -f project/vite.config.ts
          echo "Game verified"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fix dependencies and install
        working-directory: project
        run: |
          npm pkg set 'devDependencies.esbuild=^0.28.2'
          npm install

      - name: Build web game
        working-directory: project
        run: npm run build

      - name: Install Capacitor
        working-directory: project
        run: |
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli

      - name: Configure Capacitor
        working-directory: project
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.asoma.hammerhouse",
            "appName": "HAMMER HOUSE",
            "webDir": "dist"
          }
          EOF

      - name: Add Android platform
        working-directory: project
        run: npx cap add android

      - name: Sync Android
        working-directory: project
        run: npx cap sync android

      - name: Build APK
        working-directory: project
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HAMMER-HOUSE-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
