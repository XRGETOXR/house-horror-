
name: Build Hammer Man Multiplayer APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Find Hammer Man project
        id: project
        shell: bash
        run: |
          CONFIG=$(find . -name capacitor.config.json \
            -not -path "*/node_modules/*" \
            -not -path "*/android/*" \
            | head -n 1)

          if [ -z "$CONFIG" ]; then
            echo "ERROR: capacitor.config.json not found"
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$CONFIG")

          if [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "ERROR: package.json missing beside Capacitor config"
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found project: $PROJECT_DIR"

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build game
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm run build

      - name: Install Capacitor Android
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          npm install --no-save --legacy-peer-deps \
            @capacitor/core@6 \
            @capacitor/cli@6 \
            @capacitor/android@6 \
            --no-audit --no-fund

      - name: Create Android project
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Maven mirror
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const files = [
            'android/build.gradle',
            'android/settings.gradle',
            'android/app/build.gradle'
          ];
          const mirror = "maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }";
          for (const file of files) {
            if (!fs.existsSync(file)) continue;
            let content = fs.readFileSync(file, 'utf8');
            if (!content.includes('maven-central.storage-download.googleapis.com')) {
              content = content.replace(/mavenCentral\(\)/g, `${mirror}\n        mavenCentral()`);
              fs.writeFileSync(file, content);
            }
          }
          NODE

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --max-workers=2

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hammer-Man-Multiplayer-APK
          path: ${{ steps.project.outputs.dir }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
