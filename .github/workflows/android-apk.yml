
name: Build ASOMA HOUSE HAMMER APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          set -e
          test -f "horror .zip"
          mkdir project
          unzip -oq "horror .zip" -d project

          test -f project/settings.gradle.kts
          test -f project/app/build.gradle.kts
          test -f project/app/src/main/assets/index.html
          test -f project/app/src/main/assets/js/lan.js

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          set -e
          cd project
          chmod +x gradlew 2>/dev/null || true
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ASOMA-HOUSE-HAMMER-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
