
name: Build Hammer Man Multiplayer APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Locate and Extract Game
        id: locate
        shell: bash
        run: |
          set -e

          if [ -f package.json ]; then
            PROJECT="."
          else
            mkdir -p .build

            ZIP=$(find . -maxdepth 3 -type f \
              -iname "*.zip" \
              -not -path "./.git/*" \
              -not -path "./.build/*" \
              | head -n 1)

            if [ -z "$ZIP" ]; then
              echo "ERROR: Game ZIP not found"
              exit 1
            fi

            echo "Extracting: $ZIP"
            unzip -oq "$ZIP" -d .build

            PACKAGE=$(find .build -type f \
              -name package.json \
              -not -path "*/node_modules/*" \
              -not -path "*/android/*" \
              | head -n 1)

            if [ -z "$PACKAGE" ]; then
              echo "ERROR: package.json not found inside ZIP"
              exit 1
            fi

            PROJECT="${PACKAGE%/package.json}"
          fi

          if [ ! -f "$PROJECT/capacitor.config.json" ]; then
            echo "ERROR: capacitor.config.json not found"
            exit 1
          fi

          echo "dir=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

          echo "Game project found: $PROJECT"

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Fix Dependency Versions
        run: |
          cd "$PROJECT_DIR"

          npm pkg set 'devDependencies.esbuild=^0.28.2'

          echo "esbuild version requirement updated"

      - name: Install Dependencies
        run: |
          cd "$PROJECT_DIR"

          npm install --no-audit --no-fund

          npm install \
            @capacitor/core@6 \
            @capacitor/android@6 \
            --no-audit --no-fund

          npm install -D @capacitor/cli@6 \
            --no-audit --no-fund

      - name: Build Game
        run: |
          cd "$PROJECT_DIR"

          npm run build

          if [ ! -s dist/index.html ]; then
            echo "ERROR: Game build failed"
            exit 1
          fi

      - name: Create Android Project
        run: |
          cd "$PROJECT_DIR"

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Configure Android
        run: |
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_WIFI_STATE",
              "android.permission.CHANGE_WIFI_MULTICAST_STATE",
              "android.permission.ACCESS_NETWORK_STATE"
          ]

          for perm in permissions:
              if perm not in s:
                  s = s.replace(
                      "<application",
                      f'<uses-permission android:name="{perm}" />\n    <application',
                      1
                  )

          if "android:usesCleartextTraffic" not in s:
              s = s.replace(
                  "<application",
                  '<application android:usesCleartextTraffic="true"',
                  1
              )

          if "android:screenOrientation" not in s:
              s = s.replace(
                  "<activity",
                  '<activity android:screenOrientation="sensorLandscape"',
                  1
              )

          p.write_text(s)
          print("Android manifest configured")
          PY

      - name: Build APK
        run: |
          cd "$PROJECT_DIR/android"

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          APK="$PROJECT_DIR/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not created"
            exit 1
          fi

          echo "APK successfully created"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HAMMER-MAN-MULTIPLAYER-APK
          path: ${{ steps.locate.outputs.dir }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
