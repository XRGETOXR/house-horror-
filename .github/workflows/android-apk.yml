
name: Build بيت الصمت APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract game
        run: |
          set -e
          test -f "silence-game.zip"
          mkdir -p project
          unzip -oq "silence-game.zip" -d project
          test -f project/package.json
          test -f project/index.html
          test -f project/src/main.ts
          echo "Game files verified"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install game dependencies
        working-directory: project
        run: npm install

      - name: Build game
        working-directory: project
        run: |
          npm run build
          test -f dist/index.html

      - name: Install Capacitor
        working-directory: project
        run: |
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli

      - name: Configure Android app
        working-directory: project
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.okazixr.beitalsamt",
            "appName": "بيت الصمت",
            "webDir": "dist"
          }
          EOF

      - name: Add Android platform
        working-directory: project
        run: npx cap add android

      - name: Sync Android
        working-directory: project
        run: npx cap sync android

      - name: Build APK
        working-directory: project
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: بيت-الصمت-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
