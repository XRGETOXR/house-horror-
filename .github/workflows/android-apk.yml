
name: Inspect ASOMA Game ZIP

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP file
        run: |
          test -f "Asoma game.zip"
          echo "ZIP FOUND"

      - name: List ZIP contents
        run: |
          echo "===== GAME FILES ====="
          unzip -Z1 "Asoma game.zip" | head -150
          echo "===== PROJECT FILES ====="
          unzip -Z1 "Asoma game.zip" | grep -Ei \
          '(^|/)(index.html|package.json|build.gradle.kts|settings.gradle.kts|AndroidManifest.xml|vite.config.js)$' || true
