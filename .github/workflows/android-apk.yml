
name: Build ASOMA HOUSE HAMMER APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ASOMA game
        run: |
          test -f "house-hammer-android.zip"
          rm -rf app build.gradle.kts settings.gradle.kts gradle.properties
          unzip -o "house-hammer-android.zip" -d .
          test -f app/src/main/assets/index.html
          test -f app/src/main/assets/lan.js
          echo "ASOMA game verified"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Download Three.js
        run: |
          curl -fsSL -o app/src/main/assets/three.min.js \
          https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js
          test -s app/src/main/assets/three.min.js

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build ASOMA APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload new APK
        uses: actions/upload-artifact@v4
        with:
          name: ASOMA-HOUSE-HAMMER-NEW
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
