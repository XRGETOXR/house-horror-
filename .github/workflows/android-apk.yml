
name: Build بيت المطرقة APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Hammer man
        run: |
          set -e
          test -f "Hammer man.zip"
          mkdir -p project
          unzip -oq "Hammer man.zip" -d project
          test -f project/package.json
          test -f project/vite.config.ts
          test -f project/capacitor.config.json
          echo "Project verified"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        working-directory: project
        run: |
          npm pkg set 'devDependencies.esbuild=^0.28.2'
          npm install

      - name: Build game
        working-directory: project
        run: |
          npm run build
          test -f dist/index.html

      - name: Install Capacitor
        working-directory: project
        run: |
          npm install @capacitor/core@6 @capacitor/android@6
          npm install -D @capacitor/cli@6

      - name: Configure game name
        working-directory: project
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.hammerhouse.game",
            "appName": "Multiplayer horror",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            },
            "android": {
              "backgroundColor": "#050404"
            }
          }
          EOF

      - name: Add Android
        working-directory: project
        run: npx cap add android

      - name: Sync Android
        working-directory: project
        run: npx cap sync android

      - name: Build APK
        working-directory: project
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HAMMER-MAN-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
