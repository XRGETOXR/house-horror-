
name: Build HORROR HOUSE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o "HORROR_HOUSE_ANDROID_PROJECT.zip" -d .
          test -d HORROR_HOUSE_ANDROID

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "SDKMANAGER not found"
            exit 1
          fi

          echo "Using SDKMANAGER: $SDKMANAGER"

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build HORROR HOUSE APK
        run: |
          gradle --no-daemon -p HORROR_HOUSE_ANDROID assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HORROR-HOUSE-APK
          path: HORROR_HOUSE_ANDROID/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
