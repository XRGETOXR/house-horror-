
name: Build Hammer Man Multiplayer APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Hammer Man project
        run: |
          test -f package.json
          test -f capacitor.config.json
          test -f vite.config.ts
          echo "Hammer Man Multiplayer project found"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build game
        run: |
          npm run build

      - name: Install Capacitor Android
        run: |
          npm install --no-save --legacy-peer-deps \
            @capacitor/core@6 \
            @capacitor/cli@6 \
            @capacitor/android@6 \
            --no-audit --no-fund

      - name: Create and sync Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Maven mirror
        run: |
          node <<'NODE'
          const fs = require('fs');

          const files = [
            'android/build.gradle',
            'android/settings.gradle',
            'android/app/build.gradle'
          ];

          const mirror =
            "maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }";

          for (const file of files) {
            if (!fs.existsSync(file)) continue;

            let content = fs.readFileSync(file, 'utf8');

            if (!content.includes('maven-central.storage-download.googleapis.com')) {
              content = content.replace(
                /mavenCentral\(\)/g,
                `${mirror}\n        mavenCentral()`
              );
              fs.writeFileSync(file, content);
            }
          }

          console.log('Maven mirror configured');
          NODE

      - name: Configure Android fullscreen and landscape
        run: |
          node <<'NODE'
          const fs = require('fs');

          const manifest =
            'android/app/src/main/AndroidManifest.xml';

          let xml = fs.readFileSync(manifest, 'utf8');

          if (!xml.includes('android:screenOrientation')) {
            xml = xml.replace(
              '<activity',
              '<activity android:screenOrientation="sensorLandscape"'
            );
          }

          if (!xml.includes('android.permission.WAKE_LOCK')) {
            xml = xml.replace(
              '</manifest>',
              '    <uses-permission android:name="android.permission.WAKE_LOCK" />\n</manifest>'
            );
          }

          fs.writeFileSync(manifest, xml);

          const styles =
            'android/app/src/main/res/values/styles.xml';

          if (fs.existsSync(styles)) {
            let s = fs.readFileSync(styles, 'utf8');

            if (!s.includes('windowFullscreen')) {
              s = s.replace(
                '</style>',
                '    <item name="android:windowFullscreen">true</item>\n    </style>'
              );
              fs.writeFileSync(styles, s);
            }
          }
          NODE

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug \
            --no-daemon \
            --max-workers=2 \
            --stacktrace

      - name: Check APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hammer-Man-Multiplayer-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
