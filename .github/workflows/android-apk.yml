
name: Build HORROR HOUSE APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm install @capacitor/core@6 @capacitor/android@6 --no-audit --no-fund
          npm install -D @capacitor/cli@6 --no-audit --no-fund

      - name: Build game
        run: |
          npm run build
          test -s dist/index.html

      - name: Prepare Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Add LAN server
        run: |
          mkdir -p android/app/src/main/java/com/hammerhouse/game/lan
          cp android-plugin/src/main/java/com/hammerhouse/game/lan/LanServerPlugin.java android/app/src/main/java/com/hammerhouse/game/lan/

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/java/com/hammerhouse/game/MainActivity.java")
          s = p.read_text()
          s = s.replace(
              "import com.getcapacitor.BridgeActivity;",
              "import com.getcapacitor.BridgeActivity;\nimport com.hammerhouse.game.lan.LanServerPlugin;"
          )
          s = s.replace(
              "public class MainActivity extends BridgeActivity {",
              "public class MainActivity extends BridgeActivity {\n    @Override\n    public void onCreate(android.os.Bundle savedInstanceState) {\n        registerPlugin(LanServerPlugin.class);\n        super.onCreate(savedInstanceState);\n    }"
          )
          p.write_text(s)

          g = Path("android/app/build.gradle")
          s = g.read_text()
          if "Java-WebSocket" not in s:
              s = s.replace(
                  "dependencies {",
                  'dependencies {\n    implementation "org.java-websocket:Java-WebSocket:1.5.7"'
              )
          p.write_text(s)

          m = Path("android/app/src/main/AndroidManifest.xml")
          s = m.read_text()
          permissions = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_WIFI_STATE",
              "android.permission.CHANGE_WIFI_MULTICAST_STATE",
              "android.permission.ACCESS_NETWORK_STATE"
          ]
          for perm in permissions:
              line = f'<uses-permission android:name="{perm}" />'
              if perm not in s:
                  s = s.replace("<application", line + "\n    <application", 1)
          if 'android:usesCleartextTraffic=' not in s:
              s = s.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
          if 'android:screenOrientation=' not in s:
              s = s.replace("<activity", '<activity android:screenOrientation="sensorLandscape"', 1)
          m.write_text(s)
          PY

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HORROR-HOUSE-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
